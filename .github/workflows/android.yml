name: Java with Gradle CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: 'Techwin-pro/*.gradle*'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: Techwin-pro

    - name: Build with Gradle
      run: ./gradlew build
      working-directory: Techwin-pro
