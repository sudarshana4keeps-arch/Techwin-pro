name: Java with Gradle CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build project
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew build
        elif [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
          gradle build
        else
          echo "Gradle setup not found in root. Listing files:"
          ls -la
          exit 1
        fi
